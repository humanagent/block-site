<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 240px; margin: 0; padding: 16px; font: 14px -apple-system, system-ui, sans-serif; background: #111; color: #eee; }
    h1 { font-size: 15px; margin: 0; }
    #status { color: #999; font-size: 12px; margin: 6px 0 14px; }
    .pause { display: flex; gap: 8px; }
    button { flex: 1; padding: 8px; border: 1px solid #333; border-radius: 8px; background: #1c1c1c; color: #eee; font: inherit; cursor: pointer; }
    button:hover { background: #262626; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <h1>🚫 Block Site</h1>
  <div id="status"></div>
  <div class="pause">
    <button data-min="15">Pausar 15 min</button>
    <button data-min="60">Pausar 1 h</button>
    <button id="resume" hidden>Reanudar ahora</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
